    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f5f7ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-peach: #f59e0b;
            --accent-mint: #10b981;
            --border-color: #e8eefc;
            --shadow: 0 24px 60px -24px rgba(37, 99, 235, 0.24), 0 10px 24px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 24%),
                radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.18), transparent 20%),
                linear-gradient(135deg, #f7f9ff, #eef4ff);
            min-height: 100vh;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 190px;
            height: 190px;
            background: rgba(37, 99, 235, 0.1);
            top: 5%;
            left: 4%;
        }

        body::after {
            width: 220px;
            height: 220px;
            background: rgba(245, 158, 11, 0.12);
            bottom: 4%;
            right: 4%;
        }

        .page-shell {
            position: relative;
            z-index: 1;
            max-width: 940px;
            margin: 0 auto;
        }

        .portfolio-card {
            position: relative;
            background: linear-gradient(180deg, #ffffff 0%, #fdfefe 100%);
            border-radius: 34px;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 34px;
            display: grid;
            gap: 24px;
            border: 1px solid rgba(37, 99, 235, 0.08);
        }

        .portfolio-card::before {
            content: "✦";
            position: absolute;
            top: 16px;
            right: 18px;
            font-size: 22px;
            color: #f59e0b;
            opacity: 0.9;
        }

        .profile-section {
            text-align: center;
            position: relative;
            padding-top: 8px;
        }

        .profile-section::before,
        .profile-section::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            top: 8px;
        }

        .profile-section::before {
            left: 6px;
            background: rgba(37, 99, 235, 0.12);
        }

        .profile-section::after {
            right: 6px;
            background: rgba(16, 185, 129, 0.12);
        }

        .avatar-container {
            width: 108px;
            height: 108px;
            background: linear-gradient(135deg, #60a5fa, #2563eb 60%, #1d4ed8);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 34px;
            font-weight: 800;
            margin: 0 auto 18px auto;
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.22);
            transform: rotate(-4deg);
            position: relative;
        }

        .avatar-container::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 34px;
            border: 2px dashed rgba(37, 99, 235, 0.22);
        }

        .profile-section h1 {
            color: var(--text-main);
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }

        .profile-section p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .panel {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.04);
        }

        .section-title {
            color: #7c8aa5;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .skill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            border-radius: 16px;
            padding: 16px 12px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .skill-item:hover {
            transform: translateY(-3px) rotate(-1deg);
            box-shadow: 0 14px 25px rgba(15, 23, 42, 0.08);
        }

        .skill-icon-wrapper {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .python .skill-icon-wrapper {
            background-color: #eff6ff;
            color: #2563eb;
        }

        .django .skill-icon-wrapper {
            background-color: #f5f3ff;
            color: #7c3aed;
        }

        .projects-list {
            display: grid;
            gap: 12px;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            text-decoration: none;
            padding: 14px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .project-item:hover {
            transform: translateY(-3px) rotate(0.4deg);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.08);
        }

        .project-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .project-icon-wrapper {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            background: #eef4ff;
            color: #2563eb;
            flex-shrink: 0;
        }

        .project-info h3 {
            color: var(--text-main);
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        .external-link-icon {
            color: #94a3b8;
            font-size: 14px;
            flex-shrink: 0;
        }

        .contact-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 8px 12px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        }

        .social-icon {
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
            font-size: 18px;
            text-decoration: none;
            border-radius: 50%;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .social-icon:hover {
            background-color: #eff6ff;
            color: var(--accent-blue);
            transform: scale(1.08);
        }

        .footer-text {
            color: #94a3b8;
            font-size: 11px;
            letter-spacing: 0.3px;
            font-weight: 700;
        }

        @media (max-width: 720px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .portfolio-card {
                padding: 24px 18px;
                border-radius: 26px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>

</head>

<body>

                <div class="footer-text">

            </footer>
        </article>
    </main>
