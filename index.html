    <style>
        :root {
            /* Single accent color + single neutral, used consistently everywhere */
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --accent-dark: #1d4ed8;

            --neutral-50: #f8fafc;
            --neutral-100: #f1f5f9;
            --neutral-200: #e2e8f0;
            --neutral-400: #94a3b8;
            --neutral-500: #64748b;
            --neutral-900: #1e293b;

            --card-bg: #ffffff;
            --shadow: 0 20px 45px -22px rgba(37, 99, 235, 0.22), 0 6px 16px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(150deg, var(--neutral-50), #eef2fb);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle single-color decorative blobs (accent only, low opacity) */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: rgba(37, 99, 235, 0.08);
        }

        body::before {
            width: 160px;
            height: 160px;
            top: 4%;
            left: 4%;
        }

        body::after {
            width: 180px;
            height: 180px;
            bottom: 4%;
            right: 4%;
        }

        .page-shell {
            position: relative;
            z-index: 1;
            max-width: 940px;
            margin: 0 auto;
        }

        .portfolio-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 26px;
            display: grid;
            gap: 16px;
            border: 1px solid var(--neutral-200);
        }

        .profile-section {
            text-align: center;
            padding: 4px 0 4px;
        }

        .avatar-container {
            width: 92px;
            height: 92px;
            background: linear-gradient(135deg, #60a5fa, var(--accent) 60%, var(--accent-dark));
            border-radius: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: 800;
            margin: 0 auto 14px auto;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .profile-section h1 {
            color: var(--neutral-900);
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.03em;
        }

        .profile-section p {
            color: var(--neutral-500);
            font-size: 14px;
            font-weight: 700;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--neutral-200);
            border-radius: 18px;
            padding: 16px;
        }

        .section-title {
            color: var(--neutral-400);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .skill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--neutral-900);
            font-size: 13px;
            font-weight: 700;
            border-radius: 14px;
            padding: 12px 10px;
            background: var(--neutral-50);
            border: 1px solid var(--neutral-200);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .skill-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        /* All skill icons share the single accent color now */
        .skill-icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .projects-list {
            display: grid;
            gap: 10px;
        }

        .project-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            text-decoration: none;
            padding: 12px;
            border-radius: 14px;
            background: var(--neutral-50);
            border: 1px solid var(--neutral-200);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .project-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        .project-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .project-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            background: var(--accent-soft);
            color: var(--accent);
            flex-shrink: 0;
        }

        .project-info h3 {
            color: var(--neutral-900);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .project-info p {
            color: var(--neutral-500);
            font-size: 12px;
            font-weight: 600;
        }

        .external-link-icon {
            color: var(--neutral-400);
            font-size: 13px;
            flex-shrink: 0;
        }

        .contact-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-top: 2px;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: var(--neutral-50);
            border: 1px solid var(--neutral-200);
            border-radius: 999px;
            padding: 6px 10px;
        }

        .social-icon {
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neutral-500);
            font-size: 16px;
            text-decoration: none;
            border-radius: 50%;
            transition: background-color 0.15s, color 0.15s;
        }

        .social-icon:hover {
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .footer-text {
            color: var(--neutral-400);
            font-size: 11px;
            letter-spacing: 0.3px;
            font-weight: 700;
        }

        .resume-panel {
            grid-column: 1 / -1;
        }

        .resume-download {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            text-decoration: none;
            padding: 12px;
            border-radius: 14px;
            background: var(--neutral-50);
            border: 1px solid var(--neutral-200);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .resume-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        .resume-info h3 {
            color: var(--neutral-900);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .resume-info p {
            color: var(--neutral-500);
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 720px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .portfolio-card {
                padding: 18px 14px;
                border-radius: 22px;
                gap: 12px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>

</head>

            <footer class="contact-section">
